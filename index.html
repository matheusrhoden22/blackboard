<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Flappy Bird</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ─── Constants ─── */
const GAME_W = 430;
const PIPE_W = 72;
const PIPE_GAP = 170;
const PIPE_SPEED = 3.2;
const GRAVITY = 0.45;
const JUMP_VEL = -8.5;
const PIPE_INTERVAL = 90; // frames
const GROUND_H = 80;
const BIRD_R = 22;

/* ─── Canvas setup ─── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR, GAME_H, scaleFactor;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const vh = window.innerHeight;
  const vw = window.innerWidth;
  GAME_H = Math.round(vh * (GAME_W / vw));
  scaleFactor = vw / GAME_W;
  canvas.width  = GAME_W * DPR;
  canvas.height = GAME_H * DPR;
  canvas.style.width  = vw + 'px';
  canvas.style.height = vh + 'px';
  ctx.scale(DPR, DPR);
}
window.addEventListener('resize', () => { resize(); });
resize();

/* ─── State ─── */
const STATE = { IDLE: 0, PLAY: 1, DEAD: 2 };
let state, bird, pipes, score, best, frame, deathTimer, bgOffset, cloudOffset;

function initGame() {
  state = STATE.IDLE;
  bird = { x: GAME_W * 0.28, y: GAME_H * 0.45, vy: 0, angle: 0, wingPhase: 0 };
  pipes = [];
  score = 0;
  frame = 0;
  deathTimer = 0;
  bgOffset = 0;
  cloudOffset = 0;
  best = parseInt(localStorage.getItem('fb_best') || '0', 10);
}
initGame();

/* ─── Input ─── */
function flap() {
  if (state === STATE.IDLE) { state = STATE.PLAY; }
  if (state === STATE.PLAY) { bird.vy = JUMP_VEL; }
  if (state === STATE.DEAD && deathTimer > 40) { initGame(); }
}

canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });
canvas.addEventListener('mousedown',  e => { e.preventDefault(); flap(); }, { passive: false });
document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') flap(); });

/* ─── Pipe helpers ─── */
function spawnPipe() {
  const minTop = GAME_H * 0.15;
  const maxTop = GAME_H - GROUND_H - PIPE_GAP - GAME_H * 0.15;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: GAME_W + PIPE_W, topH, passed: false });
}

/* ─── Collision ─── */
function hitPipe(p) {
  const bx = bird.x, by = bird.y, br = BIRD_R - 4;
  // top pipe
  if (bx + br > p.x && bx - br < p.x + PIPE_W) {
    if (by - br < p.topH) return true;
    if (by + br > p.topH + PIPE_GAP) return true;
  }
  return false;
}

/* ─── Update ─── */
function update() {
  bgOffset  = (bgOffset  + 0.4) % GAME_W;
  cloudOffset = (cloudOffset + 0.25) % GAME_W;

  if (state === STATE.IDLE) {
    bird.y = GAME_H * 0.45 + Math.sin(frame * 0.07) * 8;
    bird.angle = 0;
    bird.wingPhase += 0.15;
    frame++;
    return;
  }

  if (state === STATE.DEAD) {
    deathTimer++;
    if (bird.y < GAME_H - GROUND_H - BIRD_R) {
      bird.vy += GRAVITY * 1.5;
      bird.y  += bird.vy;
      bird.angle = Math.min(bird.angle + 0.15, Math.PI / 2);
    }
    return;
  }

  // PLAY
  frame++;
  bird.vy += GRAVITY;
  bird.vy  = Math.min(bird.vy, 12);
  bird.y  += bird.vy;
  bird.angle = Math.max(-0.4, Math.min(Math.PI / 2, bird.vy * 0.07));
  bird.wingPhase += bird.vy < 0 ? 0.3 : 0.1;

  // spawn pipe
  if (frame % PIPE_INTERVAL === 0) spawnPipe();

  // move pipes
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= PIPE_SPEED;
    if (!pipes[i].passed && pipes[i].x + PIPE_W < bird.x) {
      pipes[i].passed = true;
      score++;
      if (score > best) { best = score; localStorage.setItem('fb_best', best); }
    }
    if (pipes[i].x + PIPE_W < -10) pipes.splice(i, 1);
  }

  // collision: ground / ceiling
  if (bird.y + BIRD_R >= GAME_H - GROUND_H || bird.y - BIRD_R <= 0) {
    die();
    return;
  }

  for (const p of pipes) {
    if (hitPipe(p)) { die(); return; }
  }
}

function die() {
  state = STATE.DEAD;
  deathTimer = 0;
}

/* ─── Draw helpers ─── */
function drawBg() {
  // sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, GAME_H - GROUND_H);
  sky.addColorStop(0,   '#48c6ef');
  sky.addColorStop(1,   '#b8f0ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, GAME_W, GAME_H - GROUND_H);

  // clouds
  drawClouds();

  // ground
  const gnd = ctx.createLinearGradient(0, GAME_H - GROUND_H, 0, GAME_H);
  gnd.addColorStop(0, '#8BC34A');
  gnd.addColorStop(0.18, '#6aa329');
  gnd.addColorStop(0.18, '#c8a96a');
  gnd.addColorStop(1,    '#a87d44');
  ctx.fillStyle = gnd;
  ctx.fillRect(0, GAME_H - GROUND_H, GAME_W, GROUND_H);

  // ground stripes
  ctx.save();
  const stripeW = 40;
  const stripeOffset = bgOffset % (stripeW * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = stripeW;
  for (let x = -stripeW * 2 + stripeOffset; x < GAME_W + stripeW * 2; x += stripeW * 2) {
    ctx.beginPath();
    ctx.moveTo(x, GAME_H - GROUND_H + 16);
    ctx.lineTo(x + 40, GAME_H);
    ctx.stroke();
  }
  ctx.restore();
}

function drawClouds() {
  const clouds = [
    { bx: 60, by: GAME_H * 0.12, s: 1.1 },
    { bx: 210, by: GAME_H * 0.08, s: 0.85 },
    { bx: 350, by: GAME_H * 0.15, s: 1.0 },
    { bx: 480, by: GAME_H * 0.09, s: 0.9 },
  ];
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  for (const cl of clouds) {
    const x = ((cl.bx - cloudOffset * 0.6) % (GAME_W + 140)) - 70;
    const y = cl.by;
    const s = cl.s;
    ctx.beginPath();
    ctx.arc(x,      y,      30 * s, 0, Math.PI * 2);
    ctx.arc(x + 28 * s, y - 10 * s, 22 * s, 0, Math.PI * 2);
    ctx.arc(x - 28 * s, y -  5 * s, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 52 * s, y,           18 * s, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPipe(p) {
  const capH = 28, capW = PIPE_W + 12, capX = p.x - 6;
  const grad1 = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  grad1.addColorStop(0,    '#4caf50');
  grad1.addColorStop(0.35, '#81c784');
  grad1.addColorStop(0.65, '#388e3c');
  grad1.addColorStop(1,    '#2e7d32');

  // top pipe body
  ctx.fillStyle = grad1;
  ctx.fillRect(p.x, 0, PIPE_W, p.topH - capH);

  // top pipe cap
  const capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
  capGrad.addColorStop(0,    '#4caf50');
  capGrad.addColorStop(0.35, '#a5d6a7');
  capGrad.addColorStop(0.65, '#388e3c');
  capGrad.addColorStop(1,    '#2e7d32');
  ctx.fillStyle = capGrad;
  roundRect(ctx, capX, p.topH - capH, capW, capH, 6);
  ctx.fill();

  // highlights
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(p.x + 8, 0, 10, p.topH - capH);
  ctx.fillRect(p.x + 10, p.topH - capH, 10, capH);

  // bottom pipe body
  const botY = p.topH + PIPE_GAP;
  ctx.fillStyle = grad1;
  ctx.fillRect(p.x, botY + capH, PIPE_W, GAME_H - GROUND_H - botY - capH);

  // bottom pipe cap
  ctx.fillStyle = capGrad;
  roundRect(ctx, capX, botY, capW, capH, 6);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(p.x + 8, botY + capH, 10, GAME_H - GROUND_H - botY - capH);
  ctx.fillRect(p.x + 10, botY, 10, capH);
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.angle);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(4, 6, BIRD_R - 4, (BIRD_R - 4) * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // body
  const bodyGrad = ctx.createRadialGradient(-4, -6, 2, 0, 0, BIRD_R);
  bodyGrad.addColorStop(0, '#fff176');
  bodyGrad.addColorStop(0.5, '#ffee58');
  bodyGrad.addColorStop(1,   '#f9a825');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
  ctx.fill();

  // wing (flapping)
  const wingAngle = Math.sin(bird.wingPhase) * 0.6;
  ctx.save();
  ctx.translate(-4, 4);
  ctx.rotate(wingAngle);
  const wingGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, 14);
  wingGrad.addColorStop(0, '#fdd835');
  wingGrad.addColorStop(1, '#f57f17');
  ctx.fillStyle = wingGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 8, Math.PI * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // eye white
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(10, -8, 9, 0, Math.PI * 2);
  ctx.fill();

  // pupil
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(12, -8, 5, 0, Math.PI * 2);
  ctx.fill();

  // shine
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(14, -10, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // beak
  ctx.fillStyle = '#ff8f00';
  ctx.beginPath();
  ctx.moveTo(18, -4);
  ctx.lineTo(30, -1);
  ctx.lineTo(18, 5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawScore() {
  // score shadow
  ctx.font = 'bold 56px -apple-system, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText(score, GAME_W / 2 + 3, 58);
  ctx.fillStyle = '#fff';
  ctx.fillText(score, GAME_W / 2, 55);
}

function drawIdleScreen() {
  // Title panel
  const panelW = 300, panelH = 90;
  const px = (GAME_W - panelW) / 2, py = GAME_H * 0.2;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(ctx, px + 4, py + 4, panelW, panelH, 18);
  ctx.fill();
  const pGrad = ctx.createLinearGradient(px, py, px, py + panelH);
  pGrad.addColorStop(0, '#fffde7');
  pGrad.addColorStop(1, '#fff176');
  ctx.fillStyle = pGrad;
  roundRect(ctx, px, py, panelW, panelH, 18);
  ctx.fill();
  ctx.strokeStyle = '#f9a825';
  ctx.lineWidth = 3;
  roundRect(ctx, px, py, panelW, panelH, 18);
  ctx.stroke();

  ctx.fillStyle = '#e65100';
  ctx.font = 'bold 42px -apple-system, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('FLAPPY BIRD', GAME_W / 2, py + panelH / 2);

  // Tap prompt
  const tapY = GAME_H * 0.72;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  roundRect(ctx, GAME_W / 2 - 130 + 3, tapY - 20 + 3, 260, 54, 27);
  ctx.fill();
  const btnGrad = ctx.createLinearGradient(0, tapY - 20, 0, tapY + 34);
  btnGrad.addColorStop(0, '#ff9800');
  btnGrad.addColorStop(1, '#e65100');
  ctx.fillStyle = btnGrad;
  roundRect(ctx, GAME_W / 2 - 130, tapY - 20, 260, 54, 27);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px -apple-system, Arial, sans-serif';
  ctx.fillText('TOQUE PARA JOGAR', GAME_W / 2, tapY + 7);

  // Best score
  if (best > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.font = '20px -apple-system, Arial, sans-serif';
    ctx.fillText('Melhor: ' + best, GAME_W / 2, tapY + 60);
  }
}

function drawGameOver() {
  // dim overlay
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  // panel
  const panelW = 310, panelH = 240;
  const px = (GAME_W - panelW) / 2, py = GAME_H * 0.28;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(ctx, px + 5, py + 5, panelW, panelH, 22);
  ctx.fill();

  const panelGrad = ctx.createLinearGradient(px, py, px, py + panelH);
  panelGrad.addColorStop(0, '#ffefd5');
  panelGrad.addColorStop(1, '#ffe0b2');
  ctx.fillStyle = panelGrad;
  roundRect(ctx, px, py, panelW, panelH, 22);
  ctx.fill();
  ctx.strokeStyle = '#ff8f00';
  ctx.lineWidth = 3;
  roundRect(ctx, px, py, panelW, panelH, 22);
  ctx.stroke();

  // "FIM DE JOGO"
  ctx.fillStyle = '#bf360c';
  ctx.font = 'bold 36px -apple-system, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('FIM DE JOGO', GAME_W / 2, py + 45);

  // divider
  ctx.strokeStyle = '#ffcc02';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px + 20, py + 75);
  ctx.lineTo(px + panelW - 20, py + 75);
  ctx.stroke();

  // scores
  ctx.font = '22px -apple-system, Arial, sans-serif';
  ctx.fillStyle = '#5d4037';
  ctx.textAlign = 'left';
  ctx.fillText('PONTUAÇÃO', px + 30, py + 110);
  ctx.fillText('MELHOR', px + 30, py + 150);

  ctx.font = 'bold 28px -apple-system, Arial, sans-serif';
  ctx.fillStyle = '#1a237e';
  ctx.textAlign = 'right';
  ctx.fillText(score, px + panelW - 30, py + 110);

  if (score >= best) {
    ctx.fillStyle = '#e65100';
    ctx.font = 'bold 14px -apple-system, Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('NOVO RECORDE!', px + panelW - 30, py + 135);
  }

  ctx.font = 'bold 28px -apple-system, Arial, sans-serif';
  ctx.fillStyle = '#1a237e';
  ctx.textAlign = 'right';
  ctx.fillText(best, px + panelW - 30, py + 150);

  // divider 2
  ctx.strokeStyle = '#ffcc02';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px + 20, py + 175);
  ctx.lineTo(px + panelW - 20, py + 175);
  ctx.stroke();

  // Restart button
  if (deathTimer > 40) {
    const btnY = py + panelH + 28;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(ctx, GAME_W / 2 - 125 + 4, btnY + 4, 250, 58, 29);
    ctx.fill();
    const btnGrad2 = ctx.createLinearGradient(0, btnY, 0, btnY + 58);
    btnGrad2.addColorStop(0, '#4caf50');
    btnGrad2.addColorStop(1, '#1b5e20');
    ctx.fillStyle = btnGrad2;
    roundRect(ctx, GAME_W / 2 - 125, btnY, 250, 58, 29);
    ctx.fill();
    ctx.strokeStyle = '#81c784';
    ctx.lineWidth = 2;
    roundRect(ctx, GAME_W / 2 - 125, btnY, 250, 58, 29);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px -apple-system, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('JOGAR NOVAMENTE', GAME_W / 2, btnY + 29);
  }
}

/* ─── Game loop ─── */
function render() {
  ctx.clearRect(0, 0, GAME_W, GAME_H);

  drawBg();
  for (const p of pipes) drawPipe(p);
  drawBird();

  if (state === STATE.PLAY || state === STATE.DEAD) drawScore();
  if (state === STATE.IDLE) drawIdleScreen();
  if (state === STATE.DEAD) drawGameOver();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
